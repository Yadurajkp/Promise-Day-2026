<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forever Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">

<style>

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#8b0000,#ff4d6d,#ffffff);
font-family:Poppins;
display:flex;
align-items:center;
justify-content:center;
color:white;
overflow:hidden;
text-align:center;
}

/* Hearts */

.heart{
position:fixed;
bottom:-20px;
font-size:22px;
animation:floatUp 7s linear infinite;
opacity:0.8;
}

@keyframes floatUp{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

/* Box */

.box{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
padding:70px 40px;
border-radius:30px;
box-shadow:0 0 40px rgba(255,77,109,0.7);
max-width:500px;
width:90%;
}

h1{
font-family:'Great Vibes';
font-size:4rem;
margin-bottom:20px;
}

p{
font-size:1.1rem;
line-height:1.8;
}

</style>
</head>

<body>

<div class="box">
<h1>She Said YES ❤️</h1>

<p>
My love, this is just the beginning of our forever.<br>
I promise to love you more each day.<br>
To stand beside you in every storm.<br>
To choose you, always. 💍<br><br>

Forever yours,<br>
<b>Yaduraj ❤️ Nivetha</b>
</p>
</div>

<script>

/* Hearts */
function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*4+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,250);

</script>

</body>
</html>
